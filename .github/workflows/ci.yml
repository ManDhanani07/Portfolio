name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build and Test Pipeline
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js runtime environment (v20)
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Step 3: Install backend dependencies (npm install)
      - name: Install Backend Dependencies
        run: |
          cd backend
          npm install

      # Step 4: Run automated tests using Jest & Supertest
      - name: Run Backend Automated Tests
        run: |
          cd backend
          npm test
