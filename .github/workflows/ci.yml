name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build and Test Pipeline
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js runtime environment (v18)
      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # Step 3: Install backend dependencies (npm install)
      - name: Install Backend Dependencies
        run: |
          cd backend
          npm install

      # Step 4: Run automated tests using Jest & Supertest
      - name: Run Backend Automated Tests
        run: |
          cd backend
          npm test

      # Step 5: Install frontend dependencies
      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      # Step 6: Build frontend production bundle (verifies code-splitting)
      - name: Build Frontend Application
        run: |
          cd frontend
          npm run build
